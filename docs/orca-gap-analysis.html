<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orca vs AI Workbench 源码级功能与体验差距调研</title>
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --surface-3: #e8ecf2;
  --surface-hover: #f7f9fc;
  --border: #e2e6ee;
  --border-strong: #cbd2df;
  --fg: #111827;
  --fg-2: #4b5563;
  --fg-3: #6b7280;
  --accent: #2563eb;
  --accent-soft: #eff6ff;
  --accent-border: #bfdbfe;
  --missing-bg: #fef2f2;
  --missing-fg: #b91c1c;
  --missing-bd: #fecaca;
  --weaker-bg: #fffbeb;
  --weaker-fg: #b45309;
  --weaker-bd: #fde68a;
  --p0-bg: #eef2ff;
  --p0-fg: #3730a3;
  --p0-bd: #c7d2fe;
  --p1-bg: #ecfeff;
  --p1-fg: #0e7490;
  --p1-bd: #a5f3fc;
  --p2-bg: #f3f4f6;
  --p2-fg: #4b5563;
  --p2-bd: #d1d5db;
  --defer-bg: #f9fafb;
  --defer-fg: #6b7280;
  --defer-bd: #d1d5db;
  --ok-bg: #ecfdf5;
  --ok-fg: #047857;
  --ok-bd: #a7f3d0;
  --sec-bg: #dc2626;
  --sec-fg: #ffffff;
  --orca-bg: #f8fbff;
  --aiwb-bg: #fffbf2;
  --advice-bg: #f0fdf4;
  --code-bg: #f3f4f6;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.12);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, ui-monospace, monospace;
  --list-w: 340px;
}

[data-theme="dark"] {
  --bg: #0b0d12;
  --surface: #11151d;
  --surface-2: #171c27;
  --surface-3: #1e2533;
  --surface-hover: #181e2a;
  --border: #232a38;
  --border-strong: #333e52;
  --fg: #eef2f8;
  --fg-2: #a5b0c2;
  --fg-3: #788498;
  --accent: #60a5fa;
  --accent-soft: rgba(59, 130, 246, 0.15);
  --accent-border: rgba(96, 165, 250, 0.36);
  --missing-bg: rgba(239, 68, 68, 0.14);
  --missing-fg: #fca5a5;
  --missing-bd: rgba(239, 68, 68, 0.32);
  --weaker-bg: rgba(245, 158, 11, 0.14);
  --weaker-fg: #fcd34d;
  --weaker-bd: rgba(245, 158, 11, 0.32);
  --p0-bg: rgba(99, 102, 241, 0.19);
  --p0-fg: #c7d2fe;
  --p0-bd: rgba(129, 140, 248, 0.38);
  --p1-bg: rgba(6, 182, 212, 0.14);
  --p1-fg: #67e8f9;
  --p1-bd: rgba(34, 211, 238, 0.3);
  --p2-bg: rgba(148, 163, 184, 0.12);
  --p2-fg: #cbd5e1;
  --p2-bd: rgba(148, 163, 184, 0.25);
  --defer-bg: rgba(100, 116, 139, 0.1);
  --defer-fg: #94a3b8;
  --defer-bd: rgba(100, 116, 139, 0.28);
  --ok-bg: rgba(16, 185, 129, 0.14);
  --ok-fg: #6ee7b7;
  --ok-bd: rgba(16, 185, 129, 0.32);
  --sec-bg: #dc2626;
  --sec-fg: #ffffff;
  --orca-bg: rgba(59, 130, 246, 0.07);
  --aiwb-bg: rgba(245, 158, 11, 0.07);
  --advice-bg: rgba(16, 185, 129, 0.08);
  --code-bg: #1a2130;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-sans); font-size: 13px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
code, .mono { font-family: var(--font-mono); font-size: 11.5px; }

/* Custom Slim Scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--fg-3); }

/* Root Viewport Shell: Fixed Slim Header + Full-Height Split Workspace */
.shell { display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; }

/* Top Single-Row Slim Header */
.topbar {
  height: 46px; flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  z-index: 20;
}
.brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13.5px; letter-spacing: -0.015em; white-space: nowrap; }
.brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.brand-ver { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-3); font-weight: 500; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--border); }

.top-tabs { display: flex; align-items: center; gap: 3px; background: var(--surface-2); padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
.top-tab {
  display: inline-flex; align-items: center; gap: 5px;
  height: 28px; padding: 0 10px; border: none; border-radius: 6px;
  background: transparent; color: var(--fg-2); font-size: 12px; font-weight: 500; white-space: nowrap;
  transition: background 0.12s, color 0.12s;
}
.top-tab:hover { color: var(--fg); background: var(--surface-hover); }
.top-tab.active { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: var(--shadow-sm); }
.top-tab .tab-cnt { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-3); }
.top-tab.active .tab-cnt { color: var(--accent); }

.top-spacer { flex: 1; min-width: 8px; }

.search-wrap { position: relative; width: 220px; flex-shrink: 1; min-width: 130px; }
.search-input {
  width: 100%; height: 30px; padding: 0 26px 0 26px;
  border-radius: 7px; border: 1px solid var(--border-strong); background: var(--bg);
  font-size: 12px; outline: none; transition: border-color 0.12s, box-shadow 0.12s, background 0.12s;
}
.search-input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--fg-3); font-size: 12px; pointer-events: none; }
.search-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: none; background: transparent; color: var(--fg-3); font-size: 14px; padding: 0 2px; display: none; }
.search-clear.show { display: inline; }

.btn {
  display: inline-flex; align-items: center; gap: 5px;
  height: 30px; padding: 0 10px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--surface); color: var(--fg-2);
  font-size: 12px; font-weight: 500; white-space: nowrap; transition: all 0.12s;
}
.btn:hover { background: var(--surface-2); color: var(--fg); border-color: var(--border-strong); }
.btn:disabled { opacity: 0.4; cursor: default; pointer-events: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--missing-fg); border-color: var(--missing-bd); background: var(--missing-bg); }
.btn.sm { height: 26px; padding: 0 8px; font-size: 11.5px; }

/* Main Workspace Container (Full Remaining Height, Never Scrolls Externally) */
.workspace { flex: 1; min-height: 0; display: flex; overflow: hidden; }

/* ====== Explorer 3-Pane Split (Rail | Master List | Resizer | Detail Pane) ====== */
.rail {
  width: 178px; flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.rail-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 7px; display: flex; flex-direction: column; gap: 2px; }
.rail-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-3); padding: 4px 8px 4px; }
.rail-btn {
  display: flex; align-items: center; gap: 6px; width: 100%;
  border: 1px solid transparent; background: transparent;
  padding: 6px 8px; border-radius: 6px; text-align: left; font-size: 12px; color: var(--fg-2);
  transition: background 0.1s, color 0.1s;
}
.rail-btn:hover { background: var(--surface-2); color: var(--fg); }
.rail-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); font-weight: 600; }
.rail-btn .r-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-btn .r-cnt { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-3); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.rail-foot {
  flex-shrink: 0; border-top: 1px solid var(--border); padding: 8px 10px 11px;
  background: var(--surface-2); font-size: 11px; color: var(--fg-2);
  display: flex; flex-direction: column; gap: 4px;
}
.rail-stat-row { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; }
.sec-quick-btn {
  width: 100%; border: 1px solid var(--missing-bd); background: var(--missing-bg); color: var(--missing-fg);
  border-radius: 6px; padding: 5px 8px; font-size: 11.5px; font-weight: 600; text-align: left;
  display: flex; align-items: center; justify-content: space-between;
}
.sec-quick-btn:hover { filter: brightness(0.97); }

/* Master List Pane (Left in 2-pane, Middle in 3-pane) */
.master-pane {
  width: var(--list-w); min-width: 240px; max-width: 560px; flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.master-head {
  flex-shrink: 0; padding: 8px 10px; border-bottom: 1px solid var(--border);
  background: var(--surface-2); display: flex; flex-direction: column; gap: 6px;
}
.master-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface-3); padding: 2px; border-radius: 6px; }
.seg button { border: none; background: transparent; padding: 3px 8px; border-radius: 5px; font-size: 11.5px; color: var(--fg-2); font-weight: 500; white-space: nowrap; }
.seg button.active { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: var(--shadow-sm); }

.chip {
  height: 23px; padding: 0 7px; border-radius: 5px;
  border: 1px solid var(--border); background: var(--surface); color: var(--fg-2);
  font-size: 11px; font-weight: 500; white-space: nowrap;
}
.chip:hover { border-color: var(--border-strong); color: var(--fg); }
.chip.active { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); font-weight: 600; }
.chip.active-sec { background: var(--sec-bg); border-color: var(--sec-bg); color: var(--sec-fg); font-weight: 600; }

.domain-select-wrap { display: none; }
.domain-select {
  width: 100%; height: 27px; border-radius: 6px; border: 1px solid var(--border-strong);
  background: var(--surface); padding: 0 8px; font-size: 12px; outline: none;
}

.master-count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }

.master-list { flex: 1; min-height: 0; overflow-y: auto; }
.list-item {
  padding: 9px 11px; border-bottom: 1px solid var(--border);
  cursor: pointer; border-left: 3px solid transparent;
  transition: background 0.08s, border-color 0.08s;
  display: flex; flex-direction: column; gap: 4px;
}
.list-item:hover { background: var(--surface-hover); }
.list-item.selected { background: var(--accent-soft); border-left-color: var(--accent); }
.li-top { display: flex; align-items: center; gap: 5px; }
.li-title { font-size: 12.5px; font-weight: 600; color: var(--fg); line-height: 1.35; }
.list-item.selected .li-title { color: var(--accent); }
.li-essence {
  font-size: 11.5px; color: var(--fg-2); line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.li-star {
  margin-left: auto; width: 22px; height: 22px; border-radius: 5px;
  border: 1px solid transparent; background: transparent; color: var(--fg-3); font-size: 13px;
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.li-star:hover { background: var(--surface-2); color: #d97706; }
.li-star.starred { color: #f59e0b; background: var(--weaker-bg); border-color: var(--weaker-bd); }

/* Draggable Splitter */
.resizer {
  width: 5px; flex-shrink: 0; cursor: col-resize; position: relative;
  background: transparent; margin-left: -3px; margin-right: -2px; z-index: 10;
}
.resizer::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px;
  background: transparent; transition: background 0.12s;
}
.resizer:hover::after, .resizer.dragging::after { background: var(--accent); width: 2px; left: 1.5px; }

/* Right Detail Pane */
.detail-pane {
  flex: 1; min-width: 0;
  background: var(--bg);
  display: flex; flex-direction: column; overflow: hidden;
}
.detail-head {
  flex-shrink: 0; padding: 11px 20px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.detail-nav { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; }
.detail-pos { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-3); padding: 0 4px; font-variant-numeric: tabular-nums; }

.detail-body {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 18px 22px 28px;
  container-type: inline-size;
}
.detail-inner { max-width: 960px; display: flex; flex-direction: column; gap: 14px; }
.detail-title { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.35; }
.essence-box {
  padding: 10px 13px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent);
  font-size: 13px; color: var(--fg); font-weight: 500;
}
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@container (max-width: 580px) {
  .compare-grid { grid-template-columns: 1fr; }
}
.cmp-card {
  border: 1px solid var(--border); border-radius: 9px; padding: 13px 15px;
  display: flex; flex-direction: column; gap: 8px;
}
.cmp-card.orca { background: var(--orca-bg); border-color: var(--accent-border); }
.cmp-card.aiwb { background: var(--aiwb-bg); border-color: var(--weaker-bd); }
.cmp-head { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; display: flex; justify-content: space-between; align-items: center; }
.cmp-card.orca .cmp-head { color: var(--accent); }
.cmp-card.aiwb .cmp-head { color: var(--weaker-fg); }
.cmp-list { margin: 0; padding-left: 17px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--fg); line-height: 1.55; }
.cmp-list li::marker { color: var(--fg-3); }

.advice-card {
  padding: 12px 15px; border-radius: 9px;
  border: 1px solid var(--ok-bd); background: var(--advice-bg);
  display: flex; flex-direction: column; gap: 5px;
}
.advice-head { font-size: 11.5px; font-weight: 700; color: var(--ok-fg); text-transform: uppercase; letter-spacing: 0.04em; }
.advice-text { font-size: 13px; color: var(--fg); line-height: 1.55; }

.refs-card {
  padding: 12px 15px; border-radius: 9px;
  background: var(--surface); border: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px;
}
.refs-head { font-size: 11px; font-weight: 700; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.04em; display: flex; justify-content: space-between; }
.refs-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.path-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 8px; border-radius: 6px;
  background: var(--code-bg); border: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-2);
  transition: all 0.12s; max-width: 100%; word-break: break-all; text-align: left;
}
.path-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.repo-tag { font-size: 9.5px; font-weight: 700; padding: 1px 4px; border-radius: 3px; text-transform: uppercase; }
.repo-tag.r-orca { background: var(--accent-soft); color: var(--accent); }
.repo-tag.r-aiwb { background: var(--weaker-bg); color: var(--weaker-fg); }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 4px; font-size: 10.5px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; line-height: 1.5; }
.b-missing { background: var(--missing-bg); color: var(--missing-fg); border-color: var(--missing-bd); }
.b-weaker { background: var(--weaker-bg); color: var(--weaker-fg); border-color: var(--weaker-bd); }
.b-p0 { background: var(--p0-bg); color: var(--p0-fg); border-color: var(--p0-bd); }
.b-p1 { background: var(--p1-bg); color: var(--p1-fg); border-color: var(--p1-bd); }
.b-p2 { background: var(--p2-bg); color: var(--p2-fg); border-color: var(--p2-bd); }
.b-defer { background: var(--defer-bg); color: var(--defer-fg); border: 1px dashed var(--defer-bd); }
.b-domain { background: var(--surface-2); color: var(--fg-2); border-color: var(--border); font-weight: 500; }
.b-sec { background: var(--sec-bg); color: var(--sec-fg); }
.b-ok { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-bd); }

/* ====== Split Layouts for Other 4 Views ====== */
.split-2 { display: flex; flex: 1; min-height: 0; width: 100%; overflow: hidden; }
.split-left {
  width: 380px; min-width: 280px; max-width: 520px; flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.split-left-half {
  width: 52%; flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.split-right {
  flex: 1; min-width: 0; background: var(--bg);
  display: flex; flex-direction: column; overflow: hidden;
}
.pane-header {
  flex-shrink: 0; padding: 10px 14px;
  background: var(--surface-2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.pane-header h2 { margin: 0; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
.pane-scroll { flex: 1; min-height: 0; overflow-y: auto; }

/* Matrix View Items */
.matrix-row {
  padding: 11px 13px; border-bottom: 1px solid var(--border);
  border-left: 3px solid transparent; cursor: pointer;
  display: flex; flex-direction: column; gap: 6px; transition: background 0.1s;
}
.matrix-row:hover { background: var(--surface-hover); }
.matrix-row.selected { background: var(--accent-soft); border-left-color: var(--accent); }
.mr-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mr-title { font-weight: 700; font-size: 13px; }
.mr-bar { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; display: flex; }
.mr-bar-m { background: #ef4444; height: 100%; }
.mr-bar-w { background: #f59e0b; height: 100%; }
.mr-verdict { font-size: 11.5px; color: var(--fg-2); line-height: 1.4; }

.domain-detail-list { display: flex; flex-direction: column; gap: 8px; }
.dd-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 13px; cursor: pointer; transition: border-color 0.12s, background 0.12s;
  display: flex; flex-direction: column; gap: 4px;
}
.dd-card:hover { border-color: var(--accent); background: var(--surface-hover); }
.dd-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dd-title { font-weight: 600; font-size: 13px; }
.dd-essence { font-size: 12px; color: var(--fg-2); }

/* Roadmap Tier Tabs in Left Pane */
.tier-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--surface-2); flex-shrink: 0; }
.tier-tab {
  border: 1px solid var(--border); background: var(--surface); border-radius: 6px;
  padding: 5px 4px; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--fg-2);
  display: flex; flex-direction: column; gap: 1px; align-items: center;
}
.tier-tab:hover { border-color: var(--border-strong); color: var(--fg); }
.tier-tab.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tier-tab small { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; opacity: 0.85; }
.tier-rationale { padding: 7px 12px; font-size: 11.5px; color: var(--fg-2); border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }

/* Strengths & Fact-checks Cards */

function initThemeAndWidth() {
  let theme = "light";
  try {
    const saved = localStorage.getItem(STORAGE_THEME);
    if (saved === "dark" || saved === "light") theme = saved;
    else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
    const lw = Number(localStorage.getItem(STORAGE_LIST_W));
    if (lw >= 240 && lw <= 560) document.documentElement.style.setProperty("--list-w", lw + "px");
  } catch {}
  applyTheme(theme);
}

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const btn = document.getElementById("themeBtn");
  if (btn) btn.textContent = theme === "dark" ? "浅色" : "深色";
  try { localStorage.setItem(STORAGE_THEME, theme); } catch {}
}

function esc(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

async function copyText(text, label) {
  try {
    await navigator.clipboard.writeText(text);
    showToast(label || "已复制");
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy");
    document.body.removeChild(ta);
    showToast(label || "已复制");
  }
}

function sortGaps(arr) {
  return arr.sort((a, b) => {
    if (a.security && !b.security) return -1;
    if (!a.security && b.security) return 1;
    const pDiff = PRIO_ORDER[a.priority] - PRIO_ORDER[b.priority];
    if (pDiff !== 0) return pDiff;
    if (a.type !== b.type) return a.type === "missing" ? -1 : 1;
    return 0;
  });
}

function matchesQuery(item, q) {
  if (!q) return true;
  const hay = [
    item.title, item.essence, DOMAIN_MAP[item.domain]?.name || "", item.advice,
    ...item.orca, ...item.aiwb, ...item.refs.map(r => r.path)
  ].join(" ").toLowerCase();
  return q.split(/\s+/).filter(Boolean).every(t => hay.includes(t));
}

function filteredGaps() {
  const q = state.query.trim().toLowerCase();
  return sortGaps(GAPS.filter(item => {
    if (state.domain !== "all" && item.domain !== state.domain) return false;
    if (state.type !== "all" && item.type !== state.type) return false;
    if (state.prio !== "all" && item.priority !== state.prio) return false;
    if (state.secOnly && !item.security) return false;
    return matchesQuery(item, q);
  }));
}

function roadmapItems() {
  const q = state.query.trim().toLowerCase();
  return sortGaps(GAPS.filter(g => g.priority === state.roadmapTier && matchesQuery(g, q)));
}

  const cls = p === "P0" ? "b-p0" : p === "P1" ? "b-p1" : p === "P2" ? "b-p2" : "b-defer";

}

}

function buildShortlistMarkdown() {
  const items = GAPS.filter(g => state.shortlist.has(g.id)).sort((a, b) => PRIO_ORDER[a.priority] - PRIO_ORDER[b.priority]);
  if (items.length === 0) return "";
  const lines = [
    "# AI Workbench 借鉴 Orca 待办清单",
    "",
    `> 基准：Orca v1.4.214 (10fb46f9fd0) vs AI Workbench v0.2.96 (8bab097) · 共 ${items.length} 项`,
    ""
  ];
  for (const item of items) {
    const typeText = item.type === "missing" ? "缺失" : "体验差距";
    const secText = item.security ? "[安全] " : "";
    lines.push(`## [${item.priority}] ${secText}${item.title} (${typeText} · ${DOMAIN_MAP[item.domain].name})`);
    lines.push(`- **核心差异**：${item.essence}`);
    lines.push(`- **落地建议**：${item.advice}`);
    lines.push(`- **源码参考**：${item.refs.map(r => `\`${r.repo}/${r.path}\``).join(" · ")}`);
    lines.push("");
  }
  return lines.join("\n");
}

function updateTopBar() {
  document.querySelectorAll("#viewTabs .top-tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.view === state.view);
  });
  document.getElementById("cntAll").textContent = GAPS.length;
  document.getElementById("cntP0").textContent = "P0·" + GAPS.filter(g => g.priority === "P0").length;
  const sc = state.shortlist.size;
  document.getElementById("cntShortlist").textContent = sc;
  document.getElementById("topExportCnt").textContent = sc;
  document.getElementById("searchClear").classList.toggle("show", state.query.length > 0);
}

function render(preserveListScroll = false) {
  const prevList = document.getElementById("masterList");
  const prevScrollTop = preserveListScroll && prevList ? prevList.scrollTop : 0;

  updateTopBar();
  const ws = document.getElementById("workspace");
  if (state.view === "explorer") ws.innerHTML = renderExplorer();
  else if (state.view === "matrix") ws.innerHTML = renderMatrix();
  else if (state.view === "roadmap") ws.innerHTML = renderRoadmap();
  else if (state.view === "strengths") ws.innerHTML = renderStrengths();
  else if (state.view === "shortlist") ws.innerHTML = renderShortlist();

  if (preserveListScroll) {
    const newList = document.getElementById("masterList");
    if (newList) newList.scrollTop = prevScrollTop;
  }
  const detailBody = document.getElementById("detailBody");
  if (detailBody) detailBody.scrollTop = 0;

  bindResizer();
}

function scrollSelectedIntoView() {
  const el = document.querySelector("#masterList .list-item.selected");
  if (el) el.scrollIntoView({ block: "nearest" });
}

function jumpToItem(id) {
  const item = GAPS.find(g => g.id === id);
  if (!item) return;
  state.view = "explorer";
  state.domain = "all";
  state.type = "all";
  state.prio = "all";
  state.secOnly = false;
  state.query = "";
  document.getElementById("searchInput").value = "";
  state.selectedId = id;
  render(false);
  requestAnimationFrame(scrollSelectedIntoView);
}

function bindResizer() {
  const resizer = document.getElementById("resizer");
  const pane = document.getElementById("masterPane");
  if (!resizer || !pane) return;
  resizer.onmousedown = e => {
    e.preventDefault();
    const startX = e.clientX;
    const startW = pane.getBoundingClientRect().width;
    resizer.classList.add("dragging");
    document.body.style.userSelect = "none";
    const onMove = ev => {
      const next = Math.max(240, Math.min(560, Math.round(startW + (ev.clientX - startX))));
      document.documentElement.style.setProperty("--list-w", next + "px");
    };
    const onUp = () => {
      resizer.classList.remove("dragging");
      document.body.style.userSelect = "";
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      try { localStorage.setItem(STORAGE_LIST_W, String(Math.round(pane.getBoundingClientRect().width))); } catch {}
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };
}

document.getElementById("searchClear").addEventListener("click", () => {

// Delegated Workspace Events
document.getElementById("workspace").addEventListener("click", e => {
  const pathBtn = e.target.closest("[data-copy-path]");
  if (pathBtn) {
    e.stopPropagation();
    copyText(pathBtn.dataset.copyPath, "已复制：" + pathBtn.dataset.copyPath);
    return;
  }
  const starBtn = e.target.closest("[data-star-id]");
  if (starBtn) {
    e.stopPropagation();
    const id = starBtn.dataset.starId;
    if (state.shortlist.has(id)) { state.shortlist.delete(id); showToast("已移出待办"); }
    else { state.shortlist.add(id); showToast("已加入待办"); }
    saveShortlist();
    render(true);
    return;
  }
  const domainBtn = e.target.closest("[data-domain]");
  if (domainBtn) {
    state.domain = domainBtn.dataset.domain;
    state.secOnly = false;
    render(false);
    return;
  }
  if (e.target.closest("[data-jump-sec]")) {
    jumpToItem("pl-01");
    return;
  }
  const typeBtn = e.target.closest("[data-type]");
  if (typeBtn) {
    state.type = typeBtn.dataset.type;
    render(false);
    return;
  }
  if (e.target.closest("[data-sec-toggle]")) {
    state.secOnly = !state.secOnly;
    if (state.secOnly) { state.domain = "all"; state.prio = "all"; state.type = "all"; }
    render(false);
    return;
  }
  const prioBtn = e.target.closest("[data-prio]");
  if (prioBtn) {
    state.secOnly = false;
    state.prio = prioBtn.dataset.prio;
    render(false);
    return;
  }
  const selRow = e.target.closest("[data-select-id]");
  if (selRow) {
    state.selectedId = selRow.dataset.selectId;
    render(true);
    scrollSelectedIntoView();
    return;
  }
  const matrixDom = e.target.closest("[data-matrix-domain]");
  if (matrixDom) {
    state.matrixDomain = matrixDom.dataset.matrixDomain;
    render(false);
    return;
  }
  const openExp = e.target.closest("[data-open-in-explorer]");
  if (openExp) {
    state.view = "explorer";
    state.domain = openExp.dataset.openInExplorer;
    state.type = "all"; state.prio = "all"; state.secOnly = false;
    render(false);
    return;
  }
  const rmTier = e.target.closest("[data-rm-tier]");
  if (rmTier) {
    state.roadmapTier = rmTier.dataset.rmTier;
    state.roadmapSelectedId = null;
    render(false);
    return;
  }
  const rmSel = e.target.closest("[data-rm-select]");
  if (rmSel) {
    state.roadmapSelectedId = rmSel.dataset.rmSelect;
    render(true);
    scrollSelectedIntoView();
    return;
  }
  const jumpEl = e.target.closest("[data-jump-id]");
  if (jumpEl) {
    jumpToItem(jumpEl.dataset.jumpId);
    return;
  }
  if (e.target.closest("#resetFiltersBtn")) {
    state.domain = "all"; state.type = "all"; state.prio = "all"; state.secOnly = false; state.query = "";
    searchInput.value = "";
    render(false);
    return;
  }
  if (e.target.closest("#addAllP0Btn")) {
    GAPS.filter(g => g.priority === "P0").forEach(g => state.shortlist.add(g.id));
    saveShortlist(); render(false); showToast("已加入全部 P0 核心项");
    return;
  }
  if (e.target.closest("#copyMdBtn")) {
    copyText(buildShortlistMarkdown(), "已复制 Markdown 待办清单");
    return;
  }
  if (e.target.closest("#downloadMdBtn")) {
    const blob = new Blob([buildShortlistMarkdown()], { type: "text/markdown;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "aiwb-orca-gap-shortlist.md"; a.click();
    URL.revokeObjectURL(a.href); showToast("已下载 aiwb-orca-gap-shortlist.md");
    return;
  }
  if (e.target.closest("#clearShortlistBtn")) {
    state.shortlist.clear(); saveShortlist(); render(false); showToast("已清空待办清单");
  }
});

document.getElementById("workspace").addEventListener("change", e => {
  if (e.target && e.target.id === "domainSelect") {
    state.domain = e.target.value;
    state.secOnly = false;
    render(false);
  }
});

// Keyboard Navigation
function stepSelection(delta) {
  if (state.view === "explorer") {
    const list = filteredGaps();
    if (!list.length) return;
    const idx = Math.max(0, list.findIndex(x => x.id === state.selectedId));
    const next = list[Math.max(0, Math.min(list.length - 1, idx + delta))];
    if (next && next.id !== state.selectedId) {
      state.selectedId = next.id; render(true); scrollSelectedIntoView();
    }
  } else if (state.view === "roadmap") {
    const list = roadmapItems();
    if (!list.length) return;
    const idx = Math.max(0, list.findIndex(x => x.id === state.roadmapSelectedId));
    const next = list[Math.max(0, Math.min(list.length - 1, idx + delta))];
    if (next && next.id !== state.roadmapSelectedId) {
      state.roadmapSelectedId = next.id; render(true); scrollSelectedIntoView();
    }
  }
}

document.addEventListener("keydown", e => {
  const inInput = document.activeElement === searchInput || ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
  if (e.key === "/" && !inInput) {
    e.preventDefault(); searchInput.focus(); return;
  }
  if (e.key === "Escape" && inInput) {
    if (state.query) { state.query = ""; searchInput.value = ""; render(false); }
    searchInput.blur(); return;
  }
  if (inInput || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "1") { state.view = "explorer"; render(false); }
  else if (e.key === "2") { state.view = "matrix"; render(false); }
  else if (e.key === "3") { state.view = "roadmap"; render(false); }
  else if (e.key === "4") { state.view = "strengths"; render(false); }
  else if (e.key === "5") { state.view = "shortlist"; render(false); }
  else if (e.key === "ArrowDown" || e.key.toLowerCase() === "j") { e.preventDefault(); stepSelection(1); }
  else if (e.key === "ArrowUp" || e.key.toLowerCase() === "k") { e.preventDefault(); stepSelection(-1); }
  else if (e.key.toLowerCase() === "s") {
    const curId = state.view === "explorer" ? state.selectedId : state.view === "roadmap" ? state.roadmapSelectedId : null;
    if (curId) {
      if (state.shortlist.has(curId)) { state.shortlist.delete(curId); showToast("已移出待办"); }
      else { state.shortlist.add(curId); showToast("已加入待办"); }
      saveShortlist(); render(true);
    }
  }
  else if (e.key.toLowerCase() === "t") {
    document.getElementById("themeBtn").click();
  }
});

initThemeAndWidth();
render(false);
</script>
</body>
</html>
