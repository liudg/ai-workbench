<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>T3 Code vs AI Workbench 源码级差距调研</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232563eb%22/><path d=%22M9 11h14v3h-5.5v8h-3v-8H9z%22 fill=%22white%22/></svg>" />
<style>
:root {
  color-scheme: light;
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eef1f6;
  --surface-hover: #f6f8fc;
  --border: #e1e6ef;
  --border-strong: #c8d1e0;
  --fg: #0f172a;
  --fg-2: #475569;
  --fg-3: #64748b;
  --accent: #2563eb;
  --accent-soft: #eff6ff;
  --accent-border: #bfdbfe;
  --missing-bg: #fef2f2;
  --missing-fg: #dc2626;
  --missing-bd: #fecaca;
  --weaker-bg: #fffbeb;
  --weaker-fg: #b45309;
  --weaker-bd: #fde68a;
  --p0-bg: #eef2ff;
  --p0-fg: #4338ca;
  --p0-bd: #c7d2fe;
  --p1-bg: #ecfeff;
  --p1-fg: #0e7490;
  --p1-bd: #a5f3fc;
  --p2-bg: #f1f5f9;
  --p2-fg: #475569;
  --p2-bd: #cbd5e1;
  --defer-bg: #f8fafc;
  --defer-fg: #64748b;
  --defer-bd: #cbd5e1;
  --ok-bg: #ecfdf5;
  --ok-fg: #047857;
  --ok-bd: #a7f3d0;
  --risk-bg: #dc2626;
  --risk-fg: #ffffff;
  --t3-head: #eff6ff;
  --aiwb-head: #fffbeb;
  --advice-bg: #f0fdf4;
  --code-bg: #eef2f7;
  --code-fg: #1e293b;
  --mark-bg: #fef08a;
  --mark-fg: #0f172a;
  --left-w: clamp(300px, 34vw, 376px);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, ui-monospace, monospace;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0e14;
  --surface: #111620;
  --surface-2: #18202e;
  --surface-hover: #151c29;
  --border: #232d3f;
  --border-strong: #32405a;
  --fg: #ecf1f9;
  --fg-2: #9fb0c7;
  --fg-3: #6e7f97;
  --accent: #60a5fa;
  --accent-soft: rgba(59, 130, 246, 0.15);
  --accent-border: rgba(96, 165, 250, 0.36);
  --missing-bg: rgba(239, 68, 68, 0.15);
  --missing-fg: #fca5a5;
  --missing-bd: rgba(239, 68, 68, 0.34);
  --weaker-bg: rgba(245, 158, 11, 0.15);
  --weaker-fg: #fcd34d;
  --weaker-bd: rgba(245, 158, 11, 0.34);
  --p0-bg: rgba(99, 102, 241, 0.2);
  --p0-fg: #c7d2fe;
  --p0-bd: rgba(129, 140, 248, 0.4);
  --p1-bg: rgba(6, 182, 212, 0.15);
  --p1-fg: #67e8f9;
  --p1-bd: rgba(34, 211, 238, 0.32);
  --p2-bg: rgba(148, 163, 184, 0.12);
  --p2-fg: #cbd5e1;
  --p2-bd: rgba(148, 163, 184, 0.26);
  --defer-bg: rgba(100, 116, 139, 0.1);
  --defer-fg: #94a3b8;
  --defer-bd: rgba(100, 116, 139, 0.28);
  --ok-bg: rgba(16, 185, 129, 0.15);
  --ok-fg: #6ee7b7;
  --ok-bd: rgba(16, 185, 129, 0.32);
  --risk-bg: #dc2626;
  --risk-fg: #ffffff;
  --t3-head: rgba(59, 130, 246, 0.1);
  --aiwb-head: rgba(245, 158, 11, 0.1);
  --advice-bg: rgba(16, 185, 129, 0.09);
  --code-bg: #1b2436;
  --code-fg: #e2e8f0;
  --mark-bg: rgba(250, 204, 21, 0.3);
  --mark-fg: #fef08a;
}

* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }
*::-webkit-scrollbar-thumb:hover { background: var(--fg-3); }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-sans); font-size: 13.5px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
code, .mono { font-family: var(--font-mono); font-size: 11.5px; }
.inline-code { font-family: var(--font-mono); font-size: 11.5px; padding: 1px 5px; border-radius: 4px; background: var(--code-bg); color: var(--code-fg); border: 1px solid var(--border); }
mark { background: var(--mark-bg); color: var(--mark-fg); padding: 0 2px; border-radius: 3px; }

/* Full-Viewport Shell */
.shell { display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; }

/* Slim Top Header */
.topbar {
  height: 44px; flex-shrink: 0;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 14px; display: flex; align-items: center; gap: 10px;
  overflow-x: auto; scrollbar-width: none;
}
.topbar::-webkit-scrollbar { display: none; }
.brand { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13.5px; white-space: nowrap; margin-right: 4px; }
.brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.brand-ver { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; color: var(--fg-3); padding: 1px 6px; border-radius: 4px; background: var(--surface-2); }

.nav-tabs { display: inline-flex; align-items: center; gap: 3px; background: var(--surface-2); padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
.tab-btn {
  border: none; background: transparent; height: 26px; padding: 0 10px; border-radius: 6px;
  font-size: 12px; font-weight: 500; color: var(--fg-2); white-space: nowrap;
  display: inline-flex; align-items: center; gap: 5px; transition: all 0.12s;
}
.tab-btn:hover { color: var(--fg); }
.tab-btn.active { background: var(--surface); color: var(--accent); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
.tab-cnt { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.8; }

.top-right { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.kpi-mini {
  border: 1px solid var(--border); background: var(--surface); height: 26px; padding: 0 8px;
  border-radius: 6px; font-size: 11.5px; color: var(--fg-2); display: inline-flex; align-items: center; gap: 4px;
}
.kpi-mini:hover { background: var(--surface-2); border-color: var(--border-strong); }
.kpi-mini strong { font-family: var(--font-mono); font-size: 11.5px; }
.kpi-mini.km-m strong { color: var(--missing-fg); }
.kpi-mini.km-w strong { color: var(--weaker-fg); }
.kpi-mini.km-p0 strong { color: var(--p0-fg); }
.kpi-mini.km-risk { background: var(--missing-bg); border-color: var(--missing-bd); color: var(--missing-fg); font-weight: 600; }

.btn {
  height: 27px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface); color: var(--fg-2); font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; transition: all 0.12s;
}
.btn:hover { background: var(--surface-2); color: var(--fg); border-color: var(--border-strong); }
.btn.active { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }

/* Split Workspace */
.workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--left-w) 5px minmax(0, 1fr); overflow: hidden; }
.workspace.full-single { grid-template-columns: minmax(0, 1fr); }

.left-pane { display: flex; flex-direction: column; min-height: 0; background: var(--surface); overflow: hidden; }
.splitter { background: var(--border); cursor: col-resize; transition: background 0.12s; position: relative; z-index: 10; }
.splitter:hover, .splitter.dragging { background: var(--accent); }
.right-pane { container-type: inline-size; min-height: 0; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); padding: 16px 20px 36px; }

/* Left Filter Header */
.filter-box { padding: 9px 10px 8px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 7px; flex-shrink: 0; background: var(--surface); }
.filter-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.filter-row.nowrap { flex-wrap: nowrap; }
.search-wrap { position: relative; flex: 1; min-width: 80px; }
.search-input {
  width: 100%; height: 29px; padding: 0 22px 0 25px; border-radius: 6px;
  border: 1px solid var(--border-strong); background: var(--surface-2); font-size: 12px; outline: none;
}
.search-input:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.search-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--fg-3); font-size: 12px; pointer-events: none; }
.search-clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: none; background: transparent; color: var(--fg-3); font-size: 14px; display: none; padding: 0 3px; }
.search-clear.show { display: inline; }

.domain-select {
  height: 29px; max-width: 120px; padding: 0 4px; border-radius: 6px;
  border: 1px solid var(--border-strong); background: var(--surface); font-size: 11.5px; color: var(--fg); outline: none; flex-shrink: 0;
}
.domain-select:focus { border-color: var(--accent); }

.seg { display: inline-flex; background: var(--surface-2); padding: 2px; border-radius: 6px; border: 1px solid var(--border); }
.seg button { border: none; background: transparent; padding: 2px 7px; border-radius: 4px; font-size: 11.5px; color: var(--fg-2); font-weight: 500; white-space: nowrap; }
.seg button.active { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

.chip {
  height: 23px; padding: 0 6.5px; border-radius: 5px; border: 1px solid var(--border);
  background: var(--surface); color: var(--fg-2); font-size: 11px; font-weight: 500; white-space: nowrap;
}
.chip:hover { border-color: var(--border-strong); color: var(--fg); }
.chip.active { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); font-weight: 600; }
.chip.active-risk { background: var(--risk-bg); border-color: var(--risk-bg); color: var(--risk-fg); }

.list-meta { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); display: inline-flex; align-items: center; gap: 5px; }
.reset-link { border: none; background: transparent; color: var(--accent); font-size: 11px; padding: 0; text-decoration: underline; }

/* Left Scrollable List */
.master-list { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.list-group-hdr {
  position: sticky; top: 0; z-index: 5;
  padding: 5px 12px; background: var(--surface-2); border-bottom: 1px solid var(--border);
  font-size: 11px; font-weight: 700; color: var(--fg-2); display: flex; justify-content: space-between; align-items: center;
}
.list-item {
  padding: 9px 11px 9px 12px; border-bottom: 1px solid var(--border);
  cursor: pointer; position: relative; transition: background 0.08s;
}
.list-item:hover { background: var(--surface-hover); }
.list-item.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.li-top { display: flex; align-items: center; gap: 5px; min-width: 0; }
.li-title { font-size: 12.8px; font-weight: 600; color: var(--fg); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item.active .li-title { color: var(--accent); font-weight: 700; }
.li-sub { margin-top: 3.5px; font-size: 11.8px; color: var(--fg-2); display: flex; align-items: center; gap: 6px; min-width: 0; }
.li-essence { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-dom { font-size: 10.5px; color: var(--fg-3); flex-shrink: 0; }

.star-btn {
  width: 22px; height: 22px; border-radius: 5px; border: 1px solid transparent;
  background: transparent; color: var(--fg-3); font-size: 13px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center; padding: 0;
}
.star-btn:hover { background: var(--surface-2); color: #d97706; }
.star-btn.starred { color: #f59e0b; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 3px; padding: 1px 5.5px; border-radius: 4px; font-size: 10.5px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; line-height: 1.4; flex-shrink: 0; }
.b-missing { background: var(--missing-bg); color: var(--missing-fg); border-color: var(--missing-bd); }
.b-weaker { background: var(--weaker-bg); color: var(--weaker-fg); border-color: var(--weaker-bd); }
.b-p0 { background: var(--p0-bg); color: var(--p0-fg); border-color: var(--p0-bd); }
.b-p1 { background: var(--p1-bg); color: var(--p1-fg); border-color: var(--p1-bd); }
.b-p2 { background: var(--p2-bg); color: var(--p2-fg); border-color: var(--p2-bd); }
.b-defer { background: var(--defer-bg); color: var(--defer-fg); border: 1px dashed var(--defer-bd); }
.b-domain { background: var(--surface-2); color: var(--fg-2); border-color: var(--border); font-weight: 500; }
.b-risk { background: var(--risk-bg); color: var(--risk-fg); }
.b-ok { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-bd); }

/* Right Detail Pane */
.detail-wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.detail-topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: nowrap; }
.detail-badges { display: flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; }
.detail-badges .b-domain { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.detail-nav { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }

.detail-hero { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; }
.detail-title { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; color: var(--fg); line-height: 1.38; }
.detail-essence {
  margin-top: 9px; padding: 7px 11px; border-radius: 6px;
  background: var(--surface-2); border-left: 3px solid var(--accent);
  font-size: 13px; color: var(--fg); font-weight: 500;
}

.cmp-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@container (min-width: 480px) {
  .cmp-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}
.cmp-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.cmp-head { padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 11.5px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.cmp-card.t3 .cmp-head { background: var(--t3-head); color: var(--accent); }
.cmp-card.aiwb .cmp-head { background: var(--aiwb-head); color: var(--weaker-fg); }
.cmp-body { padding: 11px 14px 12px 28px; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--fg); }
.cmp-body li::marker { color: var(--fg-3); }

.advice-card {
  background: var(--advice-bg); border: 1px solid var(--ok-bd); border-left: 4px solid var(--ok-fg);
  border-radius: 9px; padding: 11px 15px; display: flex; flex-direction: column; gap: 4px;
}
.advice-label { font-size: 11px; font-weight: 700; color: var(--ok-fg); letter-spacing: 0.03em; }
.advice-text { font-size: 13px; color: var(--fg); }

.refs-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 15px; display: flex; flex-direction: column; gap: 9px; }
.refs-head { font-size: 11.5px; font-weight: 700; color: var(--fg-2); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
.refs-hint { font-size: 11px; font-weight: 400; color: var(--fg-3); }
.refs-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.path-chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 6px;
  background: var(--code-bg); border: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 11.5px; color: var(--code-fg);
  transition: all 0.12s; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.path-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.repo-tag { font-size: 9.5px; font-weight: 700; padding: 0 4.5px; border-radius: 3px; }
.repo-tag.r-t3 { background: var(--accent-soft); color: var(--accent); }
.repo-tag.r-aiwb { background: var(--weaker-bg); color: var(--weaker-fg); }

/* Domain Matrix Left List */
.dom-item { padding: 11px 13px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
.dom-item:hover { background: var(--surface-hover); }
.dom-item.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.dom-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.dom-name { font-weight: 700; font-size: 13px; }
.dom-bar { height: 5px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; margin-bottom: 6px; }
.dom-bar-m { background: #ef4444; height: 100%; }
.dom-bar-w { background: #f59e0b; height: 100%; }
.dom-verdict { font-size: 11.8px; color: var(--fg-2); line-height: 1.45; }

.dom-gap-card { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 11px 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; transition: border-color 0.12s; }
.dom-gap-card:hover { border-color: var(--accent); }

/* Architecture Table */
.arch-wrap { max-width: 1280px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.arch-table { width: 100%; border-collapse: collapse; font-size: 12.8px; }
.arch-table th, .arch-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.arch-table th { position: sticky; top: 0; background: var(--surface-2); font-size: 11px; font-weight: 700; color: var(--fg-3); letter-spacing: 0.04em; }
.arch-table tr:last-child td { border-bottom: none; }
.arch-table tr:hover td { background: var(--surface-hover); }

/* Shortlist Markdown Preview */
.md-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.md-head { padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.md-pre { margin: 0; padding: 14px 16px; font-family: var(--font-mono); font-size: 12px; line-height: 1.55; white-space: pre-wrap; overflow-x: auto; color: var(--fg); }

.empty-box { padding: 48px 20px; text-align: center; color: var(--fg-3); font-size: 13px; }
.kbd-hint { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 5px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface-2); color: var(--fg-3); }

.toast {
  position: fixed; right: 18px; bottom: 18px; z-index: 99;
  background: var(--fg); color: var(--surface); padding: 7px 13px; border-radius: 8px;
  font-size: 12px; font-weight: 500; opacity: 0; transform: translateY(6px);
  pointer-events: none; transition: opacity 0.15s, transform 0.15s;
}
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 1040px) {
  .brand-ver { display: none; }
}
@media (max-width: 880px) {
  .kpi-mini { display: none; }
}
@media (max-width: 640px) {
  .workspace { grid-template-columns: 1fr; grid-template-rows: 44vh 1fr; }
  .splitter { display: none; }
  .left-pane { border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>T3 Code vs AIWB</span>
      <span class="brand-ver">v0.1.10 · v0.2.96</span>
    </div>

    <nav class="nav-tabs" id="viewTabs">
      <button type="button" class="tab-btn active" data-view="explorer">1 差距对照 <span class="tab-cnt" id="cntAll">85</span></button>
      <button type="button" class="tab-btn" data-view="matrix">2 十域矩阵 <span class="tab-cnt">10</span></button>
      <button type="button" class="tab-btn" data-view="strengths">3 反超 &amp; 纠偏 <span class="tab-cnt" id="cntStr">24</span></button>

function initLayoutAndTheme() {
  let t = "light";
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === "dark" || saved === "light") t = saved;
    else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
    const w = Number(localStorage.getItem(WIDTH_KEY));
    if (w >= 260 && w <= 780) document.documentElement.style.setProperty("--left-w", w + "px");
  } catch {}
  applyTheme(t);
}
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch {}
  document.getElementById("themeBtn").textContent = t === "dark" ? "浅色" : "深色";
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function formatRich(text, highlightQuery = true) {
  let safe = esc(text);
  // Highlight technical code-like tokens (flags, paths, camelCase/PascalCase/snake_case APIs)
  safe = safe.replace(/(`[^`]+`|--[a-zA-Z0-9_-]+(?:=[a-zA-Z0-9_./:@=-]+)?|(?:[a-zA-Z0-9_.-]+\/)*[a-zA-Z0-9_.-]+\.(?:jsonc|json|sqlite|wasm|html|toml|yaml|tsx|jsx|mjs|cjs|yml|css|log|rs|ts|js|md)(?::\d+(?:-\d+)?)?(?![a-zA-Z0-9_])|[A-Z][a-zA-Z0-9]+(?:Service|Worker|Store|Manager|Adapter|Driver|Panel|View|Card|Menu|Controller|Registry|Popup|Surface)\b|\b[a-z][a-z0-9]*_[a-z0-9_]+\b)/g, m => {
    const clean = m.startsWith("`") && m.endsWith("`") ? m.slice(1, -1) : m;
    return `<span class="inline-code">${clean}</span>`;
  });
  if (highlightQuery && state.query.trim()) {
    const q = state.query.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    try {
      safe = safe.replace(new RegExp(`(?![^<]*>)(${q})`, "ig"), "<mark>$1</mark>");
    } catch {}
  }
  return safe;
}

function hiPlain(text) {
  const safe = esc(text);
  const q = state.query.trim();
  if (!q) return safe;
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  try { return safe.replace(new RegExp(`(${escaped})`, "ig"), "<mark>$1</mark>"); } catch { return safe; }
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1700);
}

function copyText(text, msg) {
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => fallbackCopy(text, msg));
  } else fallbackCopy(text, msg);
}
function fallbackCopy(text, msg) {
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); showToast(msg); } catch {}
  ta.remove();
}

function badgeType(t, short = false) {

}

function matchesGap(g) {
  if (state.domain !== "all" && g.domain !== state.domain) return false;
  if (state.type !== "all" && g.type !== state.type) return false;
  if (state.prio !== "all" && g.priority !== state.prio) return false;
  if (state.riskOnly && !g.risk) return false;
  const q = state.query.trim().toLowerCase();
  if (!q) return true;
  const hay = [g.title, g.essence, g.advice, ...g.t3, ...g.aiwb, ...g.refs.map(r => r.path)].join(" ").toLowerCase();
  return q.split(/\s+/).every(tok => hay.includes(tok));
}

function filteredGaps() {
  const list = GAPS.filter(matchesGap);
  if (state.groupBy === "domain") {
    const domOrder = Object.fromEntries(DOMAINS.map((d, i) => [d.id, i]));
    return list.sort((a, b) => {
      const dd = domOrder[a.domain] - domOrder[b.domain];
      if (dd !== 0) return dd;
      return PRIO_ORDER[a.priority] - PRIO_ORDER[b.priority];
    });
  }
  return list.sort((a, b) => {
    const pd = PRIO_ORDER[a.priority] - PRIO_ORDER[b.priority];
    if (pd !== 0) return pd;
    if (a.type !== b.type) return a.type === "missing" ? -1 : 1;
    return 0;
  });
}

function ensureValidSelection(list) {
  if (!list.length) return null;
  if (!list.some(g => g.id === state.selectedGapId)) {
    state.selectedGapId = list[0].id;
  }
  return list.find(g => g.id === state.selectedGapId) || list[0];
}

    <div class="filter-box">
      <div class="filter-row nowrap">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input id="searchInput" class="search-input" type="text" placeholder="搜功能、机制、源码路径 (/)…" />

        </div>
        <select id="domainSelect" class="domain-select" title="按功能模块筛选">
          <option value="all">全部模块 (${GAPS.length})</option>
          ${DOMAINS.map(d => `<option value="${d.id}">${esc(d.name)} (${GAPS.filter(g => g.domain === d.id).length})</option>`).join("")}

        </div>
        <button type="button" class="chip" data-prio="P0">P0</button>
        <button type="button" class="chip" data-prio="P1">P1</button>
        <button type="button" class="chip" data-prio="P2">P2</button>
        <button type="button" class="chip" data-prio="defer">暂缓</button>
        <button type="button" class="chip" id="riskChip">隐患</button>
        <span class="list-meta" id="listMeta"></span>
      </div>
    </div>
    <div class="master-list" id="masterList"></div>
  `;

  const inp = document.getElementById("searchInput");
  inp.value = state.query;
  inp.addEventListener("input", e => {
    state.query = e.target.value;
    syncExplorerLeftList();
    renderExplorerRightDetail();
  });
  document.getElementById("searchClear").addEventListener("click", () => {
    state.query = "";
    inp.value = "";
    inp.focus();
    syncExplorerLeftList();
    renderExplorerRightDetail();
  });
  document.getElementById("domainSelect").addEventListener("change", e => {
    state.domain = e.target.value;
    syncExplorerLeftList();
    renderExplorerRightDetail();
  });
  document.getElementById("groupToggleBtn").addEventListener("click", () => {
    state.groupBy = state.groupBy === "prio" ? "domain" : "prio";
    syncExplorerLeftList();
  });
  document.getElementById("typeSeg").addEventListener("click", e => {
    const b = e.target.closest("[data-type]");
    if (!b) return;
    state.type = b.dataset.type;
    syncExplorerLeftList();
    renderExplorerRightDetail();
  });
  left.querySelector(".filter-box").addEventListener("click", e => {
    const pBtn = e.target.closest("[data-prio]");
    if (pBtn) {
      state.prio = state.prio === pBtn.dataset.prio ? "all" : pBtn.dataset.prio;
      syncExplorerLeftList();
      renderExplorerRightDetail();
      return;
    }
    if (e.target.closest("#riskChip")) {
      state.riskOnly = !state.riskOnly;
      syncExplorerLeftList();
      renderExplorerRightDetail();
      return;
    }
    if (e.target.closest("#resetFilterLink")) {
      state.domain = "all"; state.type = "all"; state.prio = "all"; state.riskOnly = false; state.query = "";
      document.getElementById("searchInput").value = "";
      syncExplorerLeftList();
      renderExplorerRightDetail();
    }
  });
}

function syncExplorerLeftList() {
  renderExplorerFilterShell();
  const list = filteredGaps();
  ensureValidSelection(list);

  document.getElementById("domainSelect").value = state.domain;
  document.getElementById("searchClear").classList.toggle("show", state.query.length > 0);
  const gBtn = document.getElementById("groupToggleBtn");
  gBtn.textContent = state.groupBy === "prio" ? "按优先级" : "按模块";
  gBtn.classList.toggle("active", state.groupBy === "domain");

  document.querySelectorAll("#typeSeg [data-type]").forEach(b => b.classList.toggle("active", b.dataset.type === state.type));
  document.querySelectorAll(".filter-box [data-prio]").forEach(b => b.classList.toggle("active", b.dataset.prio === state.prio));
  document.getElementById("riskChip").classList.toggle("active-risk", state.riskOnly);

  const hasFilter = state.domain !== "all" || state.type !== "all" || state.prio !== "all" || state.riskOnly || state.query.trim() !== "";
  document.getElementById("listMeta").innerHTML = `${list.length}项` + (hasFilter ? `<button type="button" class="reset-link" id="resetFilterLink">重置</button>` : "");

  const container = document.getElementById("masterList");
  if (list.length === 0) {
    container.innerHTML = `<div class="empty-box">无匹配条目</div>`;
    return;
  }

  let html = "";
  let lastGroup = null;
  for (const item of list) {
    const grpKey = state.groupBy === "domain" ? item.domain : item.priority;
    if (grpKey !== lastGroup) {
      lastGroup = grpKey;
      const grpTitle = state.groupBy === "domain" ? DOMAIN_MAP[grpKey].name : PRIO_LABELS[grpKey];
      const grpCount = list.filter(x => (state.groupBy === "domain" ? x.domain : x.priority) === grpKey).length;
      html += `<div class="list-group-hdr"><span>${esc(grpTitle)}</span><span class="mono">${grpCount}</span></div>`;
    }
    const active = item.id === state.selectedGapId;
    const starred = state.shortlist.has(item.id);
    html += `
      <div class="list-item ${active ? "active" : ""}" data-select-gap="${esc(item.id)}">
        <div class="li-top">
          ${state.groupBy === "domain" ? badgePrio(item.priority) : ""}
          ${badgeType(item.type, true)}
          ${item.risk ? '<span class="badge b-risk">险</span>' : ""}
          <span class="li-title">${hiPlain(item.title)}</span>
          <button type="button" class="star-btn ${starred ? "starred" : ""}" data-star-id="${esc(item.id)}" title="加入/移出待办 (S)">${starred ? "★" : "☆"}</button>
        </div>
        <div class="li-sub">
          <span class="li-essence">${hiPlain(item.essence)}</span>
          ${state.groupBy === "prio" ? `<span class="li-dom">${esc(DOMAIN_MAP[item.domain].name.split("、")[0])}</span>` : ""}
        </div>
      </div>
    `;
  }
  container.innerHTML = html;
}

function buildShortlistMarkdown() {
  const items = GAPS.filter(g => state.shortlist.has(g.id)).sort((a, b) => PRIO_ORDER[a.priority] - PRIO_ORDER[b.priority]);
  if (!items.length) return "";
  const lines = [
    "# AI Workbench 借鉴 T3 Code 待办清单",
    "",
    `> 基准：T3 Code v0.1.10 (ba640037e8) vs AI Workbench v0.2.96 (8bab097) · 共 ${items.length} 项`,
    ""
  ];
  for (const item of items) {
    lines.push(`## [${item.priority}] ${item.risk ? "[安全/风险] " : ""}${item.title} (${item.type === "missing" ? "我们没有" : "体验不如它"} · ${DOMAIN_MAP[item.domain].name})`);
    lines.push(`- **核心差距**：${item.essence}`);
    lines.push(`- **落地建议**：${item.advice}`);
    lines.push(`- **参考源码**：${item.refs.map(r => `\`${r.repo}/${r.path}\``).join(" · ")}`);
    lines.push("");
  }
  return lines.join("\n");
}

    state.query = "";
    state.type = (k === "missing" || k === "weaker") ? k : "all";
    state.prio = k === "P0" ? "P0" : "all";
    state.riskOnly = k === "risk";
    document.getElementById("leftPane").dataset.shell = "";
    renderAll();
    return;
  }
  if (e.target.closest("#themeBtn")) {
    const cur = document.documentElement.getAttribute("data-theme");
    applyTheme(cur === "dark" ? "light" : "dark");
  }
});

document.getElementById("workspace").addEventListener("click", e => {
  const pathBtn = e.target.closest("[data-copy-rel]");
  if (pathBtn) {
    e.stopPropagation();
    const val = e.shiftKey ? pathBtn.dataset.copyFull : pathBtn.dataset.copyRel;
    copyText(val, "已复制路径：" + val);
    return;
  }

  const starBtn = e.target.closest("[data-star-id]");
  if (starBtn) {
    e.stopPropagation();
    toggleGapStar(starBtn.dataset.starId);
    return;
  }

  const selGap = e.target.closest("[data-select-gap]");
  if (selGap && selGap.dataset.selectGap) {
    state.selectedGapId = selGap.dataset.selectGap;
    updateActiveClassInMasterList();
    renderExplorerRightDetail();
    return;
  }

  const jumpGap = e.target.closest("[data-jump-gap]");
  if (jumpGap) {
    state.selectedGapId = jumpGap.dataset.jumpGap;
    state.view = "explorer";
    state.domain = "all"; state.type = "all"; state.prio = "all"; state.riskOnly = false; state.query = "";
    document.getElementById("leftPane").dataset.shell = "";
    renderAll();
    requestAnimationFrame(() => {
      document.querySelector(`#masterList [data-select-gap="${state.selectedGapId}"]`)?.scrollIntoView({ block: "center" });
    });
    return;
  }

  const pickDom = e.target.closest("[data-pick-domain]");
  if (pickDom) {
    state.selectedDomainId = pickDom.dataset.pickDomain;
    document.querySelectorAll("[data-pick-domain]").forEach(el => el.classList.toggle("active", el.dataset.pickDomain === state.selectedDomainId));
    renderMatrixRight();
    return;
  }

  const filterInExp = e.target.closest("[data-filter-in-explorer]");
  if (filterInExp) {
    state.view = "explorer";
    state.domain = filterInExp.dataset.filterInExplorer;
    state.type = "all"; state.prio = "all"; state.riskOnly = false;
    document.getElementById("leftPane").dataset.shell = "";
    renderAll();
    return;
  }

  const stab = e.target.closest("[data-stab]");
  if (stab) {
    state.strengthTab = stab.dataset.stab;
    renderStrengthsView();
    return;
  }

  const pickSf = e.target.closest("[data-pick-sf]");
  if (pickSf) {
    const idx = Number(pickSf.dataset.pickSf);
    if (state.strengthTab === "strengths") state.selectedStrengthIdx = idx;
    else state.selectedFactIdx = idx;
    document.querySelectorAll("[data-pick-sf]").forEach(el => el.classList.toggle("active", Number(el.dataset.pickSf) === idx));
    renderStrengthsRight();
    return;
  }

  if (e.target.closest("#addAllP0Btn")) {
    GAPS.filter(g => g.priority === "P0").forEach(g => state.shortlist.add(g.id));
    saveShortlist();
    renderAll();
    showToast("已加入全部 P0 项");
    return;
  }
  if (e.target.closest("#addAllRiskBtn")) {
    GAPS.filter(g => g.risk).forEach(g => state.shortlist.add(g.id));
    saveShortlist();
    renderAll();
    showToast("已加入全部安全与可靠性项");
    return;
  }
  if (e.target.closest("#clearShortlistBtn")) {
    state.shortlist.clear();
    saveShortlist();
    renderAll();
    showToast("已清空待办");
    return;
  }
  if (e.target.closest("#copyMdBtn")) {
    copyText(buildShortlistMarkdown(), "已复制 Markdown 待办清单");
    return;
  }
  if (e.target.closest("#downloadMdBtn")) {
    const blob = new Blob([buildShortlistMarkdown()], { type: "text/markdown;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "aiwb-t3code-gap-shortlist.md";
    a.click();
    URL.revokeObjectURL(a.href);
    showToast("已下载 aiwb-t3code-gap-shortlist.md");
  }
});

function toggleGapStar(id) {
  const starred = !state.shortlist.has(id);
  if (starred) { state.shortlist.add(id); showToast("已加入待办"); }
  else { state.shortlist.delete(id); showToast("已移出待办"); }
  saveShortlist();
  updateTopBar();
  if (state.view === "explorer") {
    document.querySelectorAll(`#masterList [data-star-id="${id}"]`).forEach(btn => {
      btn.classList.toggle("starred", starred);
      btn.textContent = starred ? "★" : "☆";
    });
    if (state.selectedGapId === id) {
      const rightStar = document.querySelector(`#rightPane [data-star-id="${id}"]`);
      if (rightStar) {
        rightStar.classList.toggle("active", starred);
        rightStar.innerHTML = `${starred ? "★ 已入待办" : "☆ 加入待办"} <span class="kbd-hint">S</span>`;
      }
    }
  } else if (state.view === "shortlist") {
    renderShortlistView();
  }
}

// ================= DRAGGABLE SPLITTER =================
const splitter = document.getElementById("splitter");
splitter.addEventListener("mousedown", e => {
  e.preventDefault();
  splitter.classList.add("dragging");
  document.body.style.cursor = "col-resize";
  document.body.style.userSelect = "none";
  const onMove = ev => {
    const maxW = Math.min(760, Math.floor(window.innerWidth * 0.58));
    const w = Math.max(260, Math.min(maxW, ev.clientX));
    document.documentElement.style.setProperty("--left-w", w + "px");
    try { localStorage.setItem(WIDTH_KEY, String(w)); } catch {}
  };
  const onUp = () => {
    splitter.classList.remove("dragging");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
  };
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
});
splitter.addEventListener("dblclick", () => {
  document.documentElement.style.removeProperty("--left-w");
  try { localStorage.removeItem(WIDTH_KEY); } catch {}
});

// ================= KEYBOARD NAVIGATION =================
document.addEventListener("keydown", e => {
  const tag = document.activeElement?.tagName;
  const inInput = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  if (e.key === "/" && !inInput) {
    e.preventDefault();
    if (state.view !== "explorer") { state.view = "explorer"; renderAll(); }
    document.getElementById("searchInput")?.focus();
    return;
  }
  if (e.key === "Escape" && inInput) {
    const inp = document.getElementById("searchInput");
    if (document.activeElement === inp && state.query) {
      state.query = ""; inp.value = "";
      syncExplorerLeftList(); renderExplorerRightDetail();
    }
    document.activeElement.blur();
    return;
  }
  if (inInput || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (e.key === "1") { state.view = "explorer"; renderAll(); }
  else if (e.key === "2") { state.view = "matrix"; renderAll(); }
  else if (e.key === "3") { state.view = "strengths"; renderAll(); }
  else if (e.key === "4") { state.view = "arch"; renderAll(); }
  else if (e.key === "5") { state.view = "shortlist"; renderAll(); }
  else if (k === "t") { applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); }
  else if (k === "g" && state.view === "explorer") {
    state.groupBy = state.groupBy === "prio" ? "domain" : "prio";
    syncExplorerLeftList();
  }
  else if ((k === "j" || k === "k" || e.key === "ArrowDown" || e.key === "ArrowUp") && state.view === "explorer") {
    const list = filteredGaps();
    if (!list.length) return;
    e.preventDefault();
    const down = k === "j" || e.key === "ArrowDown";
    const idx = list.findIndex(x => x.id === state.selectedGapId);
    const next = down ? Math.min(list.length - 1, idx + 1) : Math.max(0, idx - 1);
    if (list[next].id !== state.selectedGapId) {
      state.selectedGapId = list[next].id;
      updateActiveClassInMasterList();
      renderExplorerRightDetail();
      document.querySelector(`#masterList [data-select-gap="${state.selectedGapId}"]`)?.scrollIntoView({ block: "nearest" });
    }
  }
  else if (k === "s" && state.view === "explorer" && state.selectedGapId) {
    e.preventDefault();
    toggleGapStar(state.selectedGapId);
  }
});

initLayoutAndTheme();
renderAll();
</script>
</body>
</html>
