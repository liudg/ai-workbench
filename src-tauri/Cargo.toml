[package]
name = "ai-workbench"
version = "0.2.42"
description = "AI 编程工作台：多项目、多会话的本�?Agent CLI 管理�?
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dev-bridge"
path = "src/bin/dev-bridge.rs"
required-features = ["dev-bridge"]

[features]
# 网页预览的本机后端（cargo run --features dev-bridge --bin dev-bridge）�?# 非默�?feature：tauri build �?cargo build --bins，不会编译这个二进制，也不会打进安装包�?# 桌面开发由 pnpm tauri:dev �?--bin ai-workbench。不要加 package.default-run�?dev-bridge = ["tauri/test"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon", "protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8"
diffy = "0.4.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
