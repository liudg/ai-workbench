[package]
name = "ai-workbench"
version = "0.1.9"
description = "AI 编程工作台：多项目、多会话的本地 Agent CLI 管理器"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
encoding_rs = "0.8"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
