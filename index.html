<!doctype html>
<html lang="zh-CN" class="dark" data-theme="graphite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>AI 工作台</title>
    <script>
      (function () {
        try {
          var override = null;
          if (typeof location !== "undefined" && location.search) {
            var q = new URLSearchParams(location.search).get("theme");
            if (q === "graphite" || q === "daylight") override = q;
          }
          var raw = localStorage.getItem("wb.theme.preference");
          var pref = raw === "daylight" || raw === "system" ? raw : "graphite";
          var light = override
            ? override === "daylight"
            : pref === "daylight" ||
              (pref === "system" &&
                typeof matchMedia === "function" &&
                matchMedia("(prefers-color-scheme: light)").matches);
          var theme = light ? "daylight" : "graphite";
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.classList.toggle("dark", !light);
          root.style.colorScheme = light ? "light" : "dark";
        } catch (_e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
