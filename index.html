<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>AI Workbench</title>
    <script>
      (() => {
        let pref = "obsidian";
        try {
          const raw = window.localStorage.getItem("aiwb.theme");
          if (raw === "obsidian" || raw === "daylight" || raw === "system") pref = raw;
        } catch {}
        const systemLight =
          typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: light)").matches;
        const resolved = pref === "system" ? (systemLight ? "daylight" : "obsidian") : pref;
        const root = document.documentElement;
        root.dataset.theme = resolved;
        root.classList.toggle("dark", resolved === "obsidian");
        root.style.colorScheme = resolved === "daylight" ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
