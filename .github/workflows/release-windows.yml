# Windows 发布流水线：构建签名安装包 + 生成 latest.json + 上传 GitHub Release。
# 触发：推送 v* tag（如 v0.1.1，须与 tauri.conf.json 的 version 一致）或手动运行。
# 需要的 Secrets：TAURI_SIGNING_PRIVATE_KEY（必填）、TAURI_SIGNING_PRIVATE_KEY_PASSWORD（可选）。

name: release-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - name: 构建 NSIS 安装包与更新产物
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 生成 latest.json（URL 自动取当前仓库与 tag）
        run: node scripts/gen-latest-json.mjs

      - name: 上传 Release 资产
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.sig
            release/latest.json
