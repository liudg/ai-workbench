# Windows 发布流水线：校验版本与公私钥配对 → 构建签名 NSIS 安装包 → 离线验签并生成 latest.json → 发布 GitHub Release。
# 触发：推送 v* tag（如 v0.2.87，须与代码内四处版本号一致）或在目标分支上手动运行。
# 手动运行时若 v<version> tag 已存在且不指向当前提交，校验会失败，不会覆盖已发布的版本。
# 需要的 Secrets：TAURI_SIGNING_PRIVATE_KEY（必填）、TAURI_SIGNING_PRIVATE_KEY_PASSWORD（无密码时无需配置）。

name: release-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 校验版本号、更新源与密钥格式
        id: meta
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/check-release-version.mjs --require-signing-key --require-tag-at-head --github-output "$env:GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      - name: 校验签名公私钥配对并运行单测
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/check-release-version.mjs --verify-keypair
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types --test scripts/release-scripts.test.mjs src/lib/native/update-source.test.ts src/features/updates/update-store.test.ts src/features/command-menu/commands.test.ts src/app/window-titlebar.render.test.ts

      - name: 构建签名 NSIS 安装包
        run: node scripts/build-release.mjs --skip-copy --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 离线验签并生成 latest.json
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: node scripts/gen-latest-json.mjs

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            release/*_x64-setup.exe
            release/*_x64-setup.exe.sig
            release/latest.json
