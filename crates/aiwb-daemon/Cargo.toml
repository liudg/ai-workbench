[package]
name = "aiwb-daemon"
description = "AI Workbench 后台进程：持有 Agent、终端、git 和数据库"
edition.workspace = true
version.workspace = true

[[bin]]
name = "aiwb-daemon"
path = "src/main.rs"

[dependencies]
aiwb-agents = { path = "../aiwb-agents" }
aiwb-core = { path = "../aiwb-core" }
aiwb-files = { path = "../aiwb-files" }
aiwb-git = { path = "../aiwb-git" }
aiwb-store = { path = "../aiwb-store" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
axum = { version = "0.7", features = ["ws"] }
fs4 = { version = "0.13", features = ["sync"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.24"
