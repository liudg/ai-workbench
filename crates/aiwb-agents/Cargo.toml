edition.workspace = true
version.workspace = true

[dependencies]
aiwb-core = { path = "../aiwb-core" }
aiwb-git = { path = "../aiwb-git" }
aiwb-proc = { path = "../aiwb-proc" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
